[package]
name = "gamemeta-wasm"
description = "The readers and both banner renderers for the browser (wasm-bindgen): files are read in place through Blob slices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gamemeta-core = { workspace = true, features = ["std"] }
gamemeta-json.workspace = true
banner3ds-scene = { workspace = true, features = ["std"] }
banner3ds-soft = { workspace = true, features = ["std"] }
banner3ds-gles.workspace = true
banner3ds-export.workspace = true
# Exact: the wasm-bindgen CLI that post-processes the module (scripts/site-build) must be the same version.
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"

[lints]
workspace = true
