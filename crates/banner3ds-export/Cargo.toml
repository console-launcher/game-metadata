[package]
name = "banner3ds-export"
description = "Animated exports of 3DS HOME banners: the frame timeline, GIF and animated WebP encoders and an MP4 muxer (pure Rust)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banner3ds-scene = { workspace = true, features = ["std"] }
banner3ds-soft = { workspace = true, features = ["std"] }
# MIT OR Apache-2.0, pure Rust.
gif = { version = "0.14", default-features = false, features = ["std"] }
color_quant = "1.1"
image-webp = "0.2"

[lints]
workspace = true

[dev-dependencies]
gamemeta-core = { workspace = true, features = ["std"] }
gamemeta-fixtures.workspace = true
