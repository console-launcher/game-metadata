[package]
name = "gamemeta-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gamemeta-core = { path = "../crates/gamemeta-core" }
banner3ds-scene = { path = "../crates/banner3ds-scene" }
banner3ds-soft = { path = "../crates/banner3ds-soft" }

# Its own workspace: nightly-only, kept out of the main gate.
[workspace]
members = ["."]

[[bin]]
name = "threeds_walk"
path = "fuzz_targets/threeds_walk.rs"
test = false
doc = false
bench = false

